name: Crear EXE Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar Java
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/classes | Out-Null
          $sources = @(Get-ChildItem -Path src -Filter '*.java' -Recurse | ForEach-Object { $_.FullName })
          & javac -encoding UTF-8 -cp 'lib/h2-2.3.232.jar' -d build/classes $sources
          if ($LASTEXITCODE -ne 0) { throw 'Error al compilar Java' }

      - name: Preparar ejecutable con H2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force paquete | Out-Null
          Copy-Item lib/h2-2.3.232.jar paquete/
          @('Main-Class: menu.InicioGrafico', 'Class-Path: h2-2.3.232.jar', '') | Set-Content -Encoding ascii manifiesto.txt
          & jar --create --file paquete/LibreriaNova.jar --manifest manifiesto.txt -C build/classes .
          if ($LASTEXITCODE -ne 0) { throw 'Error al crear JAR' }
          & jpackage --type app-image --name LibreriaNova --input paquete --main-jar LibreriaNova.jar --main-class menu.InicioGrafico --dest salida --java-options '-Dfile.encoding=UTF-8'
          if ($LASTEXITCODE -ne 0) { throw 'Error al generar EXE' }
          if (-not (Test-Path 'salida/LibreriaNova/LibreriaNova.exe')) { throw 'No se encontro el EXE' }
          Compress-Archive -Path 'salida/LibreriaNova' -DestinationPath 'LibreriaNova-Windows.zip' -Force

      - name: Publicar descarga
        uses: actions/upload-artifact@v4
        with:
          name: LibreriaNova-Windows
          path: LibreriaNova-Windows.zip
          retention-days: 30
